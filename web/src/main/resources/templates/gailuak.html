<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css}">
    <script th:src="@{./js/script.js}" src="../static/js/script.js">
    </script>

</head>

<body class="body">

        <nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background-color: rgb(96,107,255);">

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="btn btn-outline-light btn me-2" th:href="@{/gailuen_kontsulta}">Hasiera</a>
                        </li>
                        <li class="nav-item dropdown">
                            <button class="btn btn-outline-light btn dropdown-toggle" type="button"
                                id="administrazioDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                                Administrazioa
                            </button>
                            <ul class="dropdown-menu" aria-labelledby="administrazioDropdown">
                                <li><a class="dropdown-item" href="gailuen_kontsulta.html"
                                        th:href="@{/gailuen_kontsulta}">Gailuen Kontsulta</a></li>
                                <li><a class="dropdown-item" href="eraikinak.html" th:href="@{/eraikinak}">Eraikinak
                                        Kudeatu</a></li>
                                <li><a class="dropdown-item" href="gelak.html" th:href="@{/gelak}">Gelak Kudeatu</a>
                                </li>
                                <li><a class="dropdown-item" href="gailuak.html" th:href="@{/gailuak}">Gailuak
                                        Kudeatu</a></li>
                                <li><a class="dropdown-item" href="erabiltzaileak.html"
                                        th:href="@{/erabiltzaileak}">Erabiltzaileak Kudeatu</a></li>
                                <li><a class="dropdown-item" href="historikoa.html"
                                        th:href="@{/historikoa}">Historikoa</a></li>
                            </ul>
                        </li>
                    </ul>
                    <!-- UsuarioLogeado.id_erabiltzailea
                        * 1: Administratzailea
                        * 2: Erabiltzailea
                        UsuarioLogeado.rola -->
                    <div class="d-flex align-items-center text-white pe-5">
                        <a class="btn btn-outline-light btn" th:href="@{/}">Saioa itxi</a>
                        <img src="../static/img/logopj.png" th:src="@{/img/logopj.png}" alt="User Icon" class="ms-2">
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <h1>Administrazio Panela</h1><br>
    <ul class="nav custom-nav-pills mb-4" id="pills-tab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link btn btn-outline-light" id="eraikinak-tab"
                onclick="window.location.href='eraikinak.html'" type="button">Eraikinak</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link btn btn-outline-light" id="gelak-tab" onclick="window.location.href='gelak.html'"
                type="button">Gelak</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link btn btn-outline-light" id="gailuak-tab"
                onclick="window.location.href='gailuak.html'" type="button">Gailuak</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link btn btn-outline-light" id="erabiltzaileak-tab"
                onclick="window.location.href='erabiltzaileak.html'" type="button">Erabiltzaileak</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link btn btn-outline-light" id="historikoa-tab"
                onclick="window.location.href='historikoa.html'" type="button">Historikoa</button>
        </li>
    </ul><br>
    <h1>Gailuak</h1><br>
    <div class="row">
        <div class="col-12">
            <form action="/gailua-gehitu" method="post">
                <div class="row">
                    <div class="col-md-2">
                        <input type="text" name="id" class="form-control" placeholder="ID Gailua" required>
                    </div>
                    <div class="col-md-2">
                        <input type="text" name="gela" class="form-control" placeholder="ID Gela" required>
                    </div>
                    <div class="col-md-2">
                        <input type="text" name="izena" class="form-control" placeholder="Izena" required>
                    </div>
                    <div class="col-md-2">
                        <input type="text" name="mota" class="form-control" placeholder="Mota" required>
                    </div>
                    <div class="col-md-2">
                        <input type="text" name="serie" class="form-control" placeholder="Serie Zenbakia" required>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-success">Gehitu</button>
                    </div>
                </div>
            </form>
        </div>
    </div><br>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID Gailua</th>
                <th>ID Gela</th>
                <th>Izena</th>
                <th>Mota</th>
                <th>Serie Zenbakia</th>
                <th>Egoera</th>
                <th>Ekintzak</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="gailua : ${gailuak}">
                <td th:text="${gailua.id_gailua}"></td>
                <td th:text="${gailua.id_gela}"></td>
                <td th:text="${gailua.izena}"></td>
                <td th:text="${gailua.gailu_mota}"></td>
                <td th:text="${gailua.serie_zenbakia}"></td>
                <td th:text="${gailua.egoera}"></td>
                <td>
                    <button class="btn btn-warning btn-sm" onclick="editGailua(this)">Aldatu</button>
                    <form action="/gailua-ezabatu" method="post" style="display:inline;">
                        <input type="hidden" name="id_gailua" th:value="${gailua.id_gailua}">
                        <button type="submit" class="btn btn-danger btn-sm">Ezabatu</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>

</html>
