    <h1>Gailuen Kontsulta</h1><br><br>
    <!-- FILTROAK -->
    <div class="row">
        <div class="col-12 col-md-3">
        
            <label for="EraikinaMotak" class="form-label" >ERAIKINAK</label>
            
            <select class="form-select select-small" id="EraikinaMotak">

                <option value="3">Hiru</option>
            </select>
       
        </div>
        <div class="col-12 col-md-3">

        </div>
        <div class="col-12 col-md-4">
        
            <label for="GailuMotak" class="form-label" >BILATU</label>
